version: 2

project_name: kweli

before:
  hooks:
    - go mod tidy

builds:
  - id: kweli
    main: ./cmd/kweli
    binary: kweli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: kweli
    ids: [kweli]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"

release:
  github:
    owner: Dnakitare
    name: kweli
  # The Homebrew formula (homebrew-tap/Formula/kweli.rb) builds from the
  # tagged source archive via `go build`, same pattern as this account's
  # other Go CLI tools (tidemap) — deliberately not wired up here via
  # goreleaser's `brews:` integration, which would need a cross-repo PAT
  # this tool doesn't otherwise require. Update the formula's url/sha256
  # by hand (or a small script) after each tag; see RELEASING.md.
